<!DOCTYPE html>
<html class="light" lang="vi">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <title>Đăng Ký - RentHub</title>

    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
        rel="stylesheet"
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#137fec",
                        "primary-hover": "#0f6bd0",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1e293b",
                        "border-light": "#e2e8f0",
                        "border-dark": "#334155",
                    },
                    fontFamily: {
                        display: ["Manrope", "sans-serif"],
                    },
                },
            },
        };
    </script>

    <style>
        body {
            font-family: "Manrope", sans-serif;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 999px;
        }

        .auth-input {
            width: 100%;
            border-radius: 14px;
            border: 1px solid #d1d5db;
            padding: 14px 16px;
            background: white;
            transition: .2s;
        }

        .auth-input:focus {
            outline: none;
            border-color: #137fec;
            box-shadow: 0 0 0 4px rgba(19, 127, 236, .15);
        }

        .dark .auth-input {
            background: #1f2937;
            border-color: #374151;
            color: white;
        }

        .auth-submit {
            width: 100%;
            border-radius: 14px;
            background: #137fec;
            color: white;
            padding: 14px;
            font-weight: 700;
            transition: .2s;
        }

        .auth-submit:hover {
            background: #0f6bd0;
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark min-h-screen text-slate-900 dark:text-white">

    <!-- HEADER -->
    <header
        class="sticky top-0 z-50 flex items-center justify-between border-b border-border-light dark:border-border-dark bg-surface-light/90 dark:bg-surface-dark/90 backdrop-blur-md px-6 py-4 lg:px-10">

        <div class="flex items-center gap-4">
            <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary text-white">
                <span class="material-symbols-outlined">apartment</span>
            </div>

            <h2 class="text-xl font-bold">
                RentHub
            </h2>
        </div>

        <nav class="hidden md:flex items-center gap-8">
            <a href="Trangchu.html" class="font-semibold hover:text-primary transition">
                Trang chủ
            </a>

            <a href="#" class="font-semibold hover:text-primary transition">
                Danh sách phòng
            </a>

            <a href="#" class="font-semibold hover:text-primary transition">
                Liên hệ
            </a>
        </nav>

    </header>

    <!-- MAIN -->
    <main class="flex items-center justify-center p-4 md:p-8 min-h-[calc(100vh-80px)]">

        <div
            class="w-full max-w-6xl overflow-hidden rounded-3xl border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark shadow-2xl flex flex-col md:flex-row">

            <!-- LEFT -->
            <div class="relative md:w-1/2 min-h-[300px]">

                <img
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuDQh6vvugidS8Nad_U8HSfjYqajgMNsDXsSey1rCm11o01r0G73LA5p8yzYd3NNOCKDeXKDhxrLxppb6HdFgyxUKpQgikZH06rsHwU7efgwGdg60tDvey7DaPLgXBV03Eka-b6qjG-uJgpFgos-pe3OcWn-vqmnoVvQOENuwGqMJQGS55b9pXyzAuMUywd0X2vN5npyAWYTTLgbaZZ51yFcm-KYBgF4D9tzhTMipQORpMMkmSI8mp2DnY332AzbjrU6Yup02elp7nFz"
                    class="absolute inset-0 h-full w-full object-cover"
                    alt="Apartment"
                />

                <div class="absolute inset-0 bg-black/60 flex items-end p-8">

                    <div>
                        <span class="bg-primary text-white px-3 py-1 rounded-full text-xs font-bold">
                            RentHub
                        </span>

                        <h2 class="mt-4 text-3xl font-bold text-white leading-tight">
                            Bắt đầu hành trình tìm phòng của bạn
                        </h2>

                        <p class="mt-3 text-slate-200">
                            Kết nối với hàng nghìn phòng trọ và chủ nhà uy tín.
                        </p>
                    </div>

                </div>

            </div>

            <!-- RIGHT -->
            <div class="md:w-1/2 p-6 md:p-10 lg:p-14 flex flex-col justify-center">

                <div class="text-center mb-8">

                    <h1 class="text-3xl font-bold mb-2">
                        Tạo tài khoản
                    </h1>

                    <p class="text-slate-500 dark:text-slate-400">
                        Đăng ký để sử dụng RentHub
                    </p>

                </div>

                <!-- TAB -->
                <div class="flex mb-8 border-b border-border-light dark:border-border-dark">

                    <button
                        onclick="window.location.href='dangnhap.html'"
                        class="flex-1 pb-3 text-sm font-bold text-slate-500 hover:text-slate-800 transition"
                    >
                        Đăng nhập
                    </button>

                    <button
                        class="flex-1 pb-3 text-sm font-bold text-primary border-b-2 border-primary"
                    >
                        Đăng ký
                    </button>

                </div>

                <!-- MESSAGE -->
                <div
                    id="message-container"
                    class="hidden mb-5 rounded-xl p-4 text-sm font-medium"
                ></div>

                <!-- FORM -->
                <form id="register-form" class="space-y-5">

                    <!-- NAME -->
                    <div>

                        <label class="block mb-2 text-sm font-semibold">
                            Họ và tên
                        </label>

                        <input
                            type="text"
                            id="fullname"
                            class="auth-input"
                            placeholder="Nhập họ tên"
                            autocomplete="name"
                            required
                        />

                    </div>

                    <!-- EMAIL -->
                    <div>

                        <label class="block mb-2 text-sm font-semibold">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="auth-input"
                            placeholder="Nhập email"
                            autocomplete="email"
                            required
                        />

                    </div>

                    <!-- PASSWORD -->
                    <div>

                        <label class="block mb-2 text-sm font-semibold">
                            Mật khẩu
                        </label>

                        <div class="relative">

                            <input
                                type="password"
                                id="password"
                                class="auth-input pr-12"
                                placeholder="Nhập mật khẩu"
                                autocomplete="new-password"
                                required
                            />

                            <button
                                type="button"
                                data-target="password"
                                class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-slate-500"
                            >
                                <span class="material-symbols-outlined">
                                    visibility
                                </span>
                            </button>

                        </div>

                    </div>

                    <!-- CONFIRM -->
                    <div>

                        <label class="block mb-2 text-sm font-semibold">
                            Xác nhận mật khẩu
                        </label>

                        <div class="relative">

                            <input
                                type="password"
                                id="confirm-password"
                                class="auth-input pr-12"
                                placeholder="Nhập lại mật khẩu"
                                autocomplete="new-password"
                                required
                            />

                            <button
                                type="button"
                                data-target="confirm-password"
                                class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-slate-500"
                            >
                                <span class="material-symbols-outlined">
                                    visibility
                                </span>
                            </button>

                        </div>

                    </div>

                    <!-- CHECKBOX -->
                    <div class="flex items-center gap-3">

                        <input
                            type="checkbox"
                            id="agree-policy"
                            class="rounded"
                            required
                        />

                        <label
                            for="agree-policy"
                            class="text-sm text-slate-600 dark:text-slate-300"
                        >
                            Tôi đồng ý với điều khoản sử dụng
                        </label>

                    </div>

                    <!-- SUBMIT -->
                    <button
                        type="submit"
                        id="register-btn"
                        class="auth-submit flex items-center justify-center gap-2"
                    >

                        <span>Đăng ký</span>

                        <span class="material-symbols-outlined text-[18px]">
                            person_add
                        </span>

                    </button>

                </form>

            </div>

        </div>

    </main>

    <!-- SCRIPT -->
    <script type="module">

        import { register, logout } from "/js/modules/auth/auth.js";

        const form = document.getElementById("register-form");

        const messageContainer = document.getElementById("message-container");

        const registerBtn = document.getElementById("register-btn");

        function showMessage(message, type = "error") {

            messageContainer.textContent = message;

            messageContainer.className = `
                mb-5
                rounded-xl
                p-4
                text-sm
                font-medium
                ${type === "success"
                    ? "bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-300"
                    : "bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-300"
                }
            `;
        }

        // Toggle Password
        document.querySelectorAll(".toggle-password").forEach(btn => {

            btn.addEventListener("click", () => {

                const target = document.getElementById(
                    btn.dataset.target
                );

                const icon = btn.querySelector("span");

                if (target.type === "password") {

                    target.type = "text";

                    icon.textContent = "visibility_off";

                } else {

                    target.type = "password";

                    icon.textContent = "visibility";
                }

            });

        });

        // Submit
        form.addEventListener("submit", async (e) => {

            e.preventDefault();

            const fullName = document.getElementById("fullname").value.trim();

            const email = document.getElementById("email").value.trim();

            const password = document.getElementById("password").value;

            const confirmPassword = document.getElementById("confirm-password").value;

            if (fullName.length < 3) {
                showMessage("Họ tên tối thiểu 3 ký tự");
                return;
            }

            if (password.length < 6) {
                showMessage("Mật khẩu tối thiểu 6 ký tự");
                return;
            }

            if (password !== confirmPassword) {
                showMessage("Mật khẩu xác nhận không khớp");
                return;
            }

            registerBtn.disabled = true;

            registerBtn.innerHTML = `
                <svg
                    class="animate-spin h-5 w-5"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                >
                    <circle
                        class="opacity-25"
                        cx="12"
                        cy="12"
                        r="10"
                        stroke="currentColor"
                        stroke-width="4"
                    ></circle>

                    <path
                        class="opacity-75"
                        fill="currentColor"
                        d="M4 12a8 8 0 018-8v8H4z"
                    ></path>
                </svg>

                <span>Đang đăng ký...</span>
            `;

            try {

                const result = await register({
                    fullName,
                    email,
                    password,
                    role: "user"
                });

                if (result.success) {

                    showMessage(
                        "Đăng ký thành công! Đang chuyển hướng...",
                        "success"
                    );

                    await logout();

                    setTimeout(() => {
                        window.location.href = "./dangnhap.html";
                    }, 1200);

                } else {

                    showMessage(
                        result.message || "Đăng ký thất bại"
                    );

                    registerBtn.disabled = false;

                    registerBtn.innerHTML = `
                        <span>Đăng ký</span>

                        <span class="material-symbols-outlined text-[18px]">
                            person_add
                        </span>
                    `;
                }

            } catch (error) {

                console.error(error);

                showMessage("Lỗi hệ thống. Vui lòng thử lại.");

                registerBtn.disabled = false;

                registerBtn.innerHTML = `
                    <span>Đăng ký</span>

                    <span class="material-symbols-outlined text-[18px]">
                        person_add
                    </span>
                `;
            }

        });

    </script>

</body>

</html>

<!DOCTYPE html>
<html class="light" lang="vi">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>So sánh mặt bằng - SpaceRent</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "primary-dark": "#0f66bd",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1e2936",
                        "text-main-light": "#0d141b",
                        "text-main-dark": "#e2e8f0",
                        "text-sub-light": "#4c739a",
                        "text-sub-dark": "#94a3b8",
                        "border-light": "#e7edf3",
                        "border-dark": "#334155",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    }
                },
            },
        }
    </script>
</head>

<body class="bg-background-light dark:bg-background-dark text-text-main-light font-display antialiased min-h-screen flex flex-col">
    <!-- HEADER ĐƠN GIẢN -->
    <header class="bg-surface-light border-b border-border-light py-4">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 flex items-center justify-between">
            <a href="Trangchu.html" class="flex items-center gap-2 text-primary">
                <span class="material-symbols-outlined text-3xl">domain</span>
                <h2 class="text-xl font-bold text-text-main-light">SpaceRent</h2>
            </a>
            <h1 class="text-lg font-bold text-gray-800">So sánh mặt bằng</h1>
            <a href="javascript:history.back()" class="text-sm font-semibold text-primary hover:underline">Quay lại</a>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 w-full py-8">
        <div id="loading" class="text-center py-20">
            <span class="material-symbols-outlined animate-spin text-4xl text-primary">progress_activity</span>
            <p class="mt-4 text-gray-500">Đang tải thông tin mặt bằng...</p>
        </div>
        
        <div id="no-data" class="hidden text-center py-20 bg-white rounded-xl shadow border">
            <span class="material-symbols-outlined text-6xl text-gray-300">compare_arrows</span>
            <p class="mt-4 font-bold text-xl text-gray-700">Chưa có mặt bằng nào được chọn</p>
            <p class="text-gray-500 mt-2">Hãy quay lại trang tìm kiếm và thêm mặt bằng vào danh sách so sánh nhé.</p>
            <a href="timkiem.html" class="mt-6 inline-block bg-primary text-white font-bold py-2 px-6 rounded-lg hover:bg-primary-dark">Tìm kiếm ngay</a>
        </div>

        <div id="compare-container" class="hidden overflow-x-auto bg-white rounded-xl shadow border p-4">
            <table class="w-full text-left border-collapse" id="compareTable">
                <thead>
                    <tr id="row-image">
                        <th class="p-4 border-b w-48 bg-gray-50 align-top rounded-tl-xl font-bold">Hình ảnh</th>
                        <!-- Các ô chứa hình ảnh sẽ được render qua JS -->
                    </tr>
                </thead>
                <tbody class="text-sm">
                    <tr id="row-title">
                        <th class="p-4 border-b border-r bg-gray-50 font-semibold text-gray-700">Tiêu đề</th>
                    </tr>
                    <tr id="row-price">
                        <th class="p-4 border-b border-r bg-gray-50 font-semibold text-gray-700">Mức giá</th>
                    </tr>
                    <tr id="row-area">
                        <th class="p-4 border-b border-r bg-gray-50 font-semibold text-gray-700">Diện tích</th>
                    </tr>
                    <tr id="row-location">
                        <th class="p-4 border-b border-r bg-gray-50 font-semibold text-gray-700">Khu vực</th>
                    </tr>
                    <tr id="row-type">
                        <th class="p-4 border-b border-r bg-gray-50 font-semibold text-gray-700">Loại hình</th>
                    </tr>
                    <tr id="row-desc">
                        <th class="p-4 border-b border-r bg-gray-50 font-semibold text-gray-700">Mô tả tóm tắt</th>
                    </tr>
                    <tr id="row-action">
                        <th class="p-4 border-r bg-gray-50 rounded-bl-xl"></th>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script type="module">
        import { fetchAllData } from "../services/api.js";

        function getClientUserId() {
            let uid = localStorage.getItem("client_user_id");
            if (!uid) {
                uid = "guest_" + Math.random().toString(36).substr(2, 9) + Date.now();
                localStorage.setItem("client_user_id", uid);
            }
            return uid;
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const loadingEl = document.getElementById("loading");
            const noDataEl = document.getElementById("no-data");
            const containerEl = document.getElementById("compare-container");
            
            const userId = getClientUserId();
            let listIds = [];
            try {
                const res = await fetch(`/api/interactions/compare?userId=${userId}`);
                if (res.ok) listIds = await res.json();
            } catch(err) {
                console.error("Lỗi fetch compare_list:", err);
            }

            if (listIds.length === 0) {
                loadingEl.classList.add("hidden");
                document.getElementById("no-data").classList.remove("hidden");
                return;
            }

            try {
                // Tạm thời fetch tất cả và filter, nếu API có hỗ trợ fetch by ids thì tốt hơn
                const allData = await fetchAllData(20, "");
                const itemsToCompare = allData.filter(item => listIds.includes(item.id.toString()) || listIds.includes(item.id));

                if (itemsToCompare.length === 0) {
                    loadingEl.classList.add("hidden");
                    document.getElementById("no-data").classList.remove("hidden");
                    return;
                }

                // Render dữ liệu vào các dòng
                const rowImage = document.getElementById("row-image");
                const rowTitle = document.getElementById("row-title");
                const rowPrice = document.getElementById("row-price");
                const rowArea = document.getElementById("row-area");
                const rowLocation = document.getElementById("row-location");
                const rowType = document.getElementById("row-type");
                const rowDesc = document.getElementById("row-desc");
                const rowAction = document.getElementById("row-action");

                itemsToCompare.forEach(item => {
                    const imgUrl = item.image || item.images?.[0] || "https://placehold.co/400x300?text=No+Image";
                    const priceText = item.price_string || (item.price ? `${item.price.toLocaleString('vi-VN')} VNĐ` : "Thỏa thuận");

                    // 1. Image
                    rowImage.innerHTML += `
                        <td class="p-4 border-b border-l align-top text-center w-[300px] min-w-[250px]">
                            <div class="relative w-full h-40 bg-gray-100 rounded-lg overflow-hidden mb-3">
                                <img src="${imgUrl}" class="w-full h-full object-cover">
                            </div>
                            <button onclick="window.removeItem('${item.id}')" class="text-red-500 hover:text-red-700 text-xs font-bold flex items-center justify-center gap-1 mx-auto">
                                <span class="material-symbols-outlined text-[16px]">delete</span> Gỡ bỏ
                            </button>
                        </td>
                    `;
                    // 2. Title
                    rowTitle.innerHTML += `<td class="p-4 border-b border-l align-top font-bold text-primary"><a href="chitiet.html?id=${item.id}">${item.title || 'Đang cập nhật'}</a></td>`;
                    // 3. Price
                    rowPrice.innerHTML += `<td class="p-4 border-b border-l align-top font-bold text-red-600">${priceText}</td>`;
                    // 4. Area
                    rowArea.innerHTML += `<td class="p-4 border-b border-l align-top">${item.area_m2 || 0} m²</td>`;
                    // 5. Location
                    rowLocation.innerHTML += `<td class="p-4 border-b border-l align-top">${[item.district, item.region].filter(Boolean).join(", ")}</td>`;
                    // 6. Type
                    rowType.innerHTML += `<td class="p-4 border-b border-l align-top">${item.type || 'Mặt bằng'}</td>`;
                    // 7. Desc
                    rowDesc.innerHTML += `<td class="p-4 border-b border-l align-top text-gray-600"><p class="line-clamp-3">${item.description || 'Chưa có mô tả'}</p></td>`;
                    // 8. Action
                    rowAction.innerHTML += `
                        <td class="p-4 border-l align-top text-center">
                            <a href="chitiet.html?id=${item.id}" class="inline-block px-4 py-2 bg-primary text-white font-bold rounded hover:bg-primary-dark">Xem chi tiết</a>
                        </td>
                    `;
                });

                loadingEl.classList.add("hidden");
                containerEl.classList.remove("hidden");

            } catch (error) {
                console.error("Lỗi khi load dữ liệu so sánh:", error);
                loadingEl.innerHTML = `<p class="text-red-500">Có lỗi xảy ra: ${error.message}</p>`;
            }
        });

        window.removeItem = async function(id) {
            const userId = getClientUserId();
            try {
                await fetch("/api/interactions/compare", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ userId, propertyId: id })
                });
                location.reload();
            } catch(err){
                console.error(err);
            }
        };
    </script>
</body>
</html>

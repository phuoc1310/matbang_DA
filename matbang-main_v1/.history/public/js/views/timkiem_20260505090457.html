<!-- Dán đè vào phần Script cuối file timkiem.html -->
<script type="module">
  import { fetchListings } from "/js/services/api.js";
  import { applyFilter } from "/js/components/filter.js";
  import { renderPage } from "/js/components/render.js";

  document.addEventListener("DOMContentLoaded", async () => {
    console.log("🚀 Timkiem page loaded");

    try {
      // 1. Đọc URL Params
      const params = new URLSearchParams(window.location.search);
      const city = params.get("city") || "";
      const keyword = params.get("keyword") || "";
      const typeParam = params.get("type") || "";
      // support new params: minPrice/maxPrice and minArea/maxArea
      const minPriceParam = params.get("minPrice") || null;
      const maxPriceParam = params.get("maxPrice") || null;
      const minAreaParam = params.get("minArea") || null;
      const maxAreaParam = params.get("maxArea") || null;
      // legacy fallback
      const priceParam = params.get("price") || null;
      const areaParam = params.get("area") || null;

      console.log("📍 Params:", { city, keyword, typeParam, minPriceParam, maxPriceParam, minAreaParam, maxAreaParam, priceParam, areaParam });

      // 2. Map mã khu vực để hiển thị
      let regionName = "Toàn quốc";
      if (city === "hcm") { regionName = "Tp Hồ Chí Minh"; }
      else if (city === "hn") { regionName = "Hà Nội"; }
      else if (city === "dn") { regionName = "Đà Nẵng"; }
      else if (city === "bd") { regionName = "Bình Dương"; }

      // 3. Điền dữ liệu vào UI
      const searchInput = document.getElementById("search");
      if (searchInput) {
        searchInput.value = keyword;
      }

      const bcRegion = document.getElementById("bc-region");
      if (bcRegion) bcRegion.textContent = regionName;

      // Cập nhật tiêu đề kết quả
      const resultTitle = document.querySelector("#resultTitle");
      if (resultTitle) {
        let titleText = "Kết quả";
        if (typeParam) titleText += ` - ${typeParam}`;
        if (regionName !== "Toàn quốc") titleText += ` tại ${regionName}`;
        resultTitle.textContent = titleText;
      }

      // 4. Setup State - bao gồm tất cả params từ URL
      let minPrice = 0, maxPrice = 20000000000;
      if (minPriceParam !== null || maxPriceParam !== null) {
        if (minPriceParam) {
          const v = Number(minPriceParam.toString().replace(/,/g, ""));
          if (!isNaN(v)) minPrice = v;
        }
        if (maxPriceParam) {
          const v = Number(maxPriceParam.toString().replace(/,/g, ""));
          if (!isNaN(v)) maxPrice = v;
        }
      } else if (priceParam) {
        const [pMin, pMax] = priceParam.split("-").map(s => Number(s.replace(/,/g, '')));
        if (!isNaN(pMin)) minPrice = pMin;
        if (!isNaN(pMax)) maxPrice = pMax;
      }

      let minArea = 0, maxArea = 99999;
      if (minAreaParam !== null || maxAreaParam !== null) {
        if (minAreaParam) {
          const v = Number(minAreaParam.toString().replace(/,/g, ''));
          if (!isNaN(v)) minArea = v;
        }
        if (maxAreaParam) {
          const v = Number(maxAreaParam.toString().replace(/,/g, ''));
          if (!isNaN(v)) maxArea = v;
        }
      } else if (areaParam) {
        const [aMin, aMax] = areaParam.split("-").map(Number);
        if (!isNaN(aMin)) minArea = aMin;
        if (!isNaN(aMax)) maxArea = aMax;
      }

      window.__SEARCH_STATE__ = {
        keyword: keyword,
        city: city,
        type: typeParam,
        minPrice: minPrice,
        maxPrice: maxPrice,
        minArea: minArea,
        maxArea: maxArea
      };
      window.PAGE_SIZE = 9;
      window.currentPage = 1;

      // UI Loading
      const listingEl = document.getElementById("listing");
      if (listingEl) {
        listingEl.innerHTML = `
          <div class="col-span-3 text-center py-20">
            <span class="material-symbols-outlined animate-spin text-5xl text-primary">progress_activity</span>
            <p class="mt-4 text-slate-500">Đang tìm kiếm mặt bằng phù hợp...</p>
          </div>`;
      }

      // 5. Gọi API & Render
      console.log(`📥 Fetching data for keyword: "${keyword}", type: "${typeParam}"`);

      const paramsForFetch = {
        keyword,
        type: typeParam,
        minPrice,
        maxPrice,
        minArea,
        maxArea,
        page: window.currentPage,
        limit: window.PAGE_SIZE,
      };
      // Only send city when a short code was provided (avoid sending 'Toàn quốc')
      if (city) paramsForFetch.city = regionName;

      const data = await fetchListings(paramsForFetch);

      console.log("✅ Raw data loaded:", data?.length, "items");

      if (data && data.length > 0) {
        applyFilter();
      } else {
        console.warn("⚠️ No data from API");
        if (listingEl) {
          listingEl.innerHTML = `
            <div class="col-span-3 text-center py-20">
              <span class="material-symbols-outlined text-5xl text-gray-400">search_off</span>
              <p class="mt-4 text-gray-600">Không tìm thấy mặt bằng nào</p>
              <p class="text-sm text-gray-500 mt-2">Hãy thử tìm kiếm với từ khóa khác</p>
            </div>`;
        }
      }

      // 6. Gán sự kiện bộ lọc
      const applyBtn = document.getElementById("applyFilterBtn");
      if (applyBtn) {
        applyBtn.addEventListener("click", () => {
          // Cập nhật state từ các input trong sidebar trước khi lọc
          const minPriceEl = document.getElementById("minPrice");
          const maxPriceEl = document.getElementById("maxPrice");
          if (minPriceEl) window.__SEARCH_STATE__.minPrice = Number(minPriceEl.value.replace(/,/g, "")) || 0;
          if (maxPriceEl) window.__SEARCH_STATE__.maxPrice = Number(maxPriceEl.value.replace(/,/g, "")) || 20000000000;
          window.__SEARCH_STATE__.keyword = searchInput?.value?.trim() || "";
          window.currentPage = 1;
          applyFilter();
        });
      }

      const clearSearchBtn = document.getElementById("clear-search");
      
      const toggleClearButton = () => {
        if (clearSearchBtn && searchInput) {
          if (searchInput.value.trim()) {
            clearSearchBtn.classList.remove("opacity-0", "pointer-events-none");
            clearSearchBtn.classList.add("opacity-100", "pointer-events-auto");
          } else {
            clearSearchBtn.classList.add("opacity-0", "pointer-events-none");
            clearSearchBtn.classList.remove("opacity-100", "pointer-events-auto");
          }
        }
      };

      if (searchInput) {
        setTimeout(toggleClearButton, 100);
        
        let searchTimeout;
        searchInput.addEventListener("input", () => {
          toggleClearButton();
          clearTimeout(searchTimeout);
          searchTimeout = setTimeout(() => {
            window.__SEARCH_STATE__.keyword = searchInput.value.trim();
            window.currentPage = 1;
            applyFilter();
          }, 300);
        });
        
        searchInput.addEventListener("keyup", (e) => {
          if (e.key === "Enter") {
            clearTimeout(searchTimeout);
            window.__SEARCH_STATE__.keyword = searchInput.value.trim();
            window.currentPage = 1;
            applyFilter();
          }
        });
      }

      if (clearSearchBtn && searchInput) {
        clearSearchBtn.addEventListener("click", (e) => {
          e.preventDefault();
          searchInput.value = "";
          toggleClearButton();
          searchInput.focus();
          
          window.__SEARCH_STATE__ = {
            ...window.__SEARCH_STATE__,
            keyword: "",
          };
          window.currentPage = 1;
          applyFilter();
        });
      }

    } catch (error) {
      console.error("❌ Error loading data:", error);
      const listingEl = document.getElementById("listing");
      if (listingEl) {
        listingEl.innerHTML = `
          <div class="col-span-3 text-center py-20 text-red-500">
            <span class="material-symbols-outlined text-5xl">error</span>
            <p class="mt-4 font-semibold">Đã xảy ra lỗi khi tải dữ liệu</p>
            <p class="text-sm mt-2">${error.message}</p>
            <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-primary text-white rounded-lg">
              Thử lại
            </button>
          </div>`;
      }
    }
  });
</script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const guestUI = document.getElementById("guest-actions");
    const userUI = document.getElementById("user-actions");
    const userNameEl = document.getElementById("user-name");
    const logoutBtn = document.getElementById("btn-logout");

    const raw = sessionStorage.getItem("currentUser");
    if (!raw) return;

    const user = JSON.parse(raw);

    // switch UI
    guestUI?.classList.add("hidden");
    userUI?.classList.remove("hidden");

    if (userNameEl) {
      userNameEl.textContent = user.fullName || user.email || "User";
    }

    logoutBtn?.addEventListener("click", () => {
      sessionStorage.removeItem("currentUser");
      location.reload();
    });
  });
</script>

</html>

  <script>
    // Global handlers to avoid third-party scripts throwing uncaught exceptions
    window.addEventListener('unhandledrejection', function (ev) {
      // convert fatal unhandled rejections into warnings so our UI code keeps running
      console.warn('Unhandled promise rejection (suppressed):', ev.reason);
      ev.preventDefault?.();
    });

    window.addEventListener('error', function (ev) {
      // If error originates from third-party (like ads or extensions), warn instead of breaking
      try {
        const src = (ev?.filename || '').toLowerCase();
        if (src.includes('gads-scrapper') || src.includes('onboarding')) {
          console.warn('Third-party script error suppressed:', ev.message, ev.filename);
          ev.preventDefault?.();
        }
      } catch (e) {
        // ignore
      }
    });
  </script>

  <!-- Search History Dropdown -->
  <script>
    // User ID helper — ưu tiên user thực từ session
    function getClientUserId() {
      try {
        const raw = sessionStorage.getItem('currentUser');
        if (raw) {
          const u = JSON.parse(raw);
          if (u.id || u.postgres_id) return u.id || u.postgres_id;
        }
      } catch (e) {}
      // Fallback cho guest
      let uid = localStorage.getItem("client_user_id");
      if (!uid) {
        uid = "guest_" + Math.random().toString(36).substr(2, 9) + Date.now();
        localStorage.setItem("client_user_id", uid);
      }
      return uid;
    }

    // Lưu lịch sử tìm kiếm vào API
    async function saveSearchToHistory(keyword, city) {
      const userId = getClientUserId();
      if (!userId || (!keyword && !city)) return;
      try {
        await fetch('/api/interactions/history', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, keyword: keyword || null, city: city || null })
        });
      } catch (e) { console.warn('Lỗi lưu lịch sử:', e); }
    }

    // Inject CSS
    (function() {
      if (document.getElementById('sh-dropdown-styles')) return;
      const style = document.createElement('style');
      style.id = 'sh-dropdown-styles';
      style.textContent = `
        .sh-dropdown{display:none;position:absolute;top:100%;left:0;right:0;z-index:999;margin-top:6px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.1),0 2px 8px rgba(0,0,0,.06);overflow:hidden;animation:shSlideIn .22s cubic-bezier(.4,0,.2,1)}
        .dark .sh-dropdown{background:#1e293b;border-color:#334155;box-shadow:0 12px 40px rgba(0,0,0,.35)}
        @keyframes shSlideIn{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
        .sh-dropdown.show{display:block}
        .sh-dropdown-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;border-bottom:1px solid #f1f5f9}
        .dark .sh-dropdown-header{border-color:#334155}
        .sh-dropdown-header .sh-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;display:flex;align-items:center;gap:6px}
        .sh-dropdown-header .sh-title .material-symbols-outlined{font-size:16px}
        .sh-dropdown-clear{font-size:12px;color:#ef4444;cursor:pointer;font-weight:600;padding:3px 10px;border-radius:8px;border:none;background:0 0;transition:all .15s}
        .sh-dropdown-clear:hover{background:#fef2f2;color:#dc2626}
        .dark .sh-dropdown-clear:hover{background:rgba(127,29,29,.2)}

    async function showSearchHistory() {
      const searchInput = document.querySelector("#search");
      if (!searchInput) return;
      let dropdown = document.getElementById("searchHistoryDropdown");
      if (!dropdown) {
        dropdown = document.createElement("div");
        dropdown.id = "searchHistoryDropdown";
        dropdown.className = "sh-dropdown";
        const container = searchInput.closest('.relative') || searchInput.parentElement;
        container.style.position = "relative";
        container.appendChild(dropdown);
      }
      const userId = getClientUserId();
      let history = [];
      try { const res = await fetch(`/api/interactions/history?userId=${userId}`); if (res.ok) history = await res.json(); } catch(e) {}
      if (history.length === 0) {
        dropdown.innerHTML = `<div class="sh-dropdown-header"><span class="sh-title"><span class="material-symbols-outlined">history</span>Tìm kiếm gần đây</span></div><div class="sh-dropdown-empty"><span class="material-symbols-outlined">manage_search</span>Chưa có lịch sử tìm kiếm</div>`;
        dropdown.classList.add("show"); return;
      }
      let html = `<div class="sh-dropdown-header"><span class="sh-title"><span class="material-symbols-outlined">history</span>Tìm kiếm gần đây</span><button type="button" class="sh-dropdown-clear" onclick="window.clearHistory()">Xóa tất cả</button></div>`;
      history.forEach(item => {
        const kw = item.keyword || '', ct = item.city || '', display = kw || 'Tất cả';
        html += `<div class="sh-dropdown-item" data-keyword="${kw}" data-city="${ct}"><div class="sh-icon-wrap"><span class="material-symbols-outlined">history</span></div><span class="sh-text">${display}</span>${ct ? `<span class="sh-badge">${ct}</span>` : ''}</div>`;
      });
      dropdown.innerHTML = html;
      dropdown.querySelectorAll('.sh-dropdown-item').forEach(el => {
        el.addEventListener('mousedown', (e) => {
          e.preventDefault();
          searchInput.value = el.dataset.keyword || '';
          hideSearchHistory();
          // Trigger search on timkiem page
          const url = new URL(window.location);
          url.searchParams.set("keyword", el.dataset.keyword || '');
          if (el.dataset.city) url.searchParams.set("city", el.dataset.city);
          window.location.href = url.toString();
        });
      });
      dropdown.classList.add("show");
    }
    function hideSearchHistory() {
      const d = document.getElementById("searchHistoryDropdown");
      if (d) d.classList.remove("show");
    }
    window.clearHistory = async function() {
      const userId = getClientUserId();
      try { await fetch(`/api/interactions/history?userId=${userId}`, { method: "DELETE" }); showSearchHistory(); } catch(e){}
    };
    // ================== PRICE SLIDER & LABELS UI SYNC ==================
    function parseMoney(v) {
      return Number(String(v || "").replace(/[^\d]/g, "")) || 0;
    }

    function formatPriceLabel(value) {
      if (value === 0) return "0 VND";
      if (value >= 1000000000) {
        const bill = value / 1000000000;
        return (Number.isInteger(bill) ? bill : bill.toFixed(1)) + " tỷ VND";
      }
      if (value >= 1000000) {
        const mill = value / 1000000;
        return (Number.isInteger(mill) ? mill : mill.toFixed(1)) + " triệu VND";
      }
      return value.toLocaleString('vi-VN') + " VND";
    }

    function formatNumberWithCommas(value) {
      const num = parseMoney(value);
      return num.toLocaleString('en-US');
    }

    function updatePriceFilterUI() {
      const minVal = parseMoney(document.getElementById("minPrice")?.value || "0");
      const maxVal = parseMoney(document.getElementById("maxPrice")?.value || "20000000000");

      const minLabel = document.getElementById("minPriceLabel");
      const maxLabel = document.getElementById("maxPriceLabel");
      if (minLabel) minLabel.textContent = formatPriceLabel(minVal);
      if (maxLabel) maxLabel.textContent = formatPriceLabel(maxVal);

      // Update visual slider bar and handles
      const maxLimit = 20000000000;
      const minPercent = Math.min(100, Math.max(0, (minVal / maxLimit) * 100));
      const maxPercent = Math.min(100, Math.max(0, (maxVal / maxLimit) * 100));

      const sliderBar = document.getElementById("priceSliderBar");
      const handleMin = document.getElementById("priceSliderHandleMin");
      const handleMax = document.getElementById("priceSliderHandleMax");

      if (sliderBar) {
        sliderBar.style.left = `${minPercent}%`;
        sliderBar.style.right = `${100 - maxPercent}%`;
      }
      if (handleMin) {
        handleMin.style.left = `${minPercent}%`;
      }
      if (handleMax) {
        handleMax.style.left = `${maxPercent}%`;
      }
    }
    window.updatePriceFilterUI = updatePriceFilterUI;

    document.addEventListener("DOMContentLoaded", () => {
      const minPriceEl = document.getElementById("minPrice");
      const maxPriceEl = document.getElementById("maxPrice");

      if (minPriceEl && maxPriceEl) {
        // Format initial values
        minPriceEl.value = formatNumberWithCommas(minPriceEl.value);
        maxPriceEl.value = formatNumberWithCommas(maxPriceEl.value);
        // Initial sync
        updatePriceFilterUI();

        // Listeners for inputs
        minPriceEl.addEventListener("input", (e) => {
          const cursor = e.target.selectionStart;
          const prevLen = e.target.value.length;
          e.target.value = formatNumberWithCommas(e.target.value);
          const diff = e.target.value.length - prevLen;
          e.target.setSelectionRange(cursor + diff, cursor + diff);
          updatePriceFilterUI();
        });

        maxPriceEl.addEventListener("input", (e) => {
          const cursor = e.target.selectionStart;
          const prevLen = e.target.value.length;
          e.target.value = formatNumberWithCommas(e.target.value);
          const diff = e.target.value.length - prevLen;
          e.target.setSelectionRange(cursor + diff, cursor + diff);
          updatePriceFilterUI();
        });
      }
    });
    // ===================================================================
    
    document.addEventListener("DOMContentLoaded", () => {
      const searchInput = document.querySelector("#search");
      if (!searchInput) return;
      searchInput.addEventListener("focus", showSearchHistory);
      searchInput.addEventListener("blur", () => setTimeout(hideSearchHistory, 200));
      searchInput.addEventListener("input", () => { searchInput.value.trim() ? hideSearchHistory() : showSearchHistory(); });
    });
  </script>
  <script type="module">
    import { fetchAllListings } from "/js/services/api.js?v=1.0.5";
    import { applyFilter } from "/js/components/filter.js?v=1.0.5";

    (async () => {

      console.log("🚀 Timkiem page loaded");

      // =====================================
      // STATE
      // =====================================
      window.PAGE_SIZE = 9;
      window.currentPage = 1;

      // =====================================
      // URL PARAMS
      // =====================================
      const params = new URLSearchParams(
        window.location.search
      );

      const city =
        params.get("city") || "";

      const keyword =
        params.get("keyword") || "";

      const typeParam =
        params.get("type") || "";

      // =====================================
      // REGION NAME
      // =====================================
      let regionName = "Toàn quốc";

      if (city === "hcm") {
        regionName = "TP Hồ Chí Minh";
      }

      else if (city === "hn") {
        regionName = "Hà Nội";
      }

      else if (city === "dn") {
        regionName = "Đà Nẵng";
      }

      // =====================================
      // UI
      // =====================================
      const searchInput =
        document.getElementById("search");

      const clearSearchBtn =
        document.getElementById(
          "clear-search"
        );

      const listingEl =
        document.getElementById(
          "listing"
        );

      const mapContainer =
        document.getElementById(
          "mapContainer"
        );

      const toggleMapBtn =
        document.getElementById(
          "toggleMapView"
        );

      // =====================================
      // TITLE
      // =====================================
      document.getElementById(
        "bc-region"
      ).textContent = regionName;

      const resultTitle =
        document.getElementById(
          "resultTitle"
        );

      let title = "Kết quả";

      if (typeParam) {
        title += ` - ${typeParam}`;
      }

      if (regionName !== "Toàn quốc") {
        title += ` tại ${regionName}`;
      }

      resultTitle.textContent = title;

      // =====================================
      // SEARCH STATE
      // =====================================
      const urlMinPrice = params.get("minPrice");
      const urlMaxPrice = params.get("maxPrice");
      const urlMinArea = params.get("minArea");
      const urlMaxArea = params.get("maxArea");

      window.__SEARCH_STATE__ = {
        keyword,
        city,
        type: typeParam,
        minPrice: urlMinPrice ? Number(urlMinPrice) : 0,
        maxPrice: urlMaxPrice ? Number(urlMaxPrice) : 20000000000,
        minArea: urlMinArea ? Number(urlMinArea) : 0,
        maxArea: urlMaxArea ? Number(urlMaxArea) : 99999,
      };

      // Pre-fill price inputs from URL params
      if (urlMinPrice) {
        const minPriceEl = document.getElementById("minPrice");
        if (minPriceEl) minPriceEl.value = urlMinPrice;
      }
      if (urlMaxPrice) {
        const maxPriceEl = document.getElementById("maxPrice");
        if (maxPriceEl) maxPriceEl.value = urlMaxPrice;
      }

      // Pre-fill type checkboxes from URL params
      if (typeParam) {
        const typeNormalized = typeParam.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, "");
        let targetType = "";
        if (typeNormalized.includes("vanphong") || typeNormalized.includes("vanphong")) {
          targetType = "vanphong";
        } else if (typeNormalized.includes("matbang") || typeNormalized.includes("matbang")) {
          targetType = "matbang";
        } else if (typeNormalized.includes("canho") || typeNormalized.includes("canho")) {
          targetType = "canho";
        }
        if (targetType) {
          const cb = document.querySelector(`input[data-type="${targetType}"]`);
          if (cb) cb.checked = true;
        }
      }

      // Pre-fill area checkboxes from URL params
      if (urlMinArea || urlMaxArea) {
        const minA = Number(urlMinArea || 0);
        const maxA = Number(urlMaxArea || 99999);
        let targetArea = "";
        if (minA === 0 && maxA === 30) {
          targetArea = "0-30";
        } else if (minA === 30 && maxA === 50) {
          targetArea = "30-50";
        } else if (minA === 50 && maxA === 80) {
          targetArea = "50-80";
        } else if (minA === 80) {
          targetArea = "80+";
        }
        if (targetArea) {
          const cb = document.querySelector(`input[data-area="${targetArea}"]`);
          if (cb) cb.checked = true;
        }
      }

      // =====================================
      // LOADING
      // =====================================
      listingEl.innerHTML = `
      <div class="col-span-3 text-center py-20">
        <span class="material-symbols-outlined animate-spin text-5xl text-primary">
          progress_activity
        </span>

        <p class="mt-4 text-slate-500">
          Đang tải dữ liệu...
        </p>
      </div>
    `;

      // =====================================
      // FETCH DATA
      // =====================================
      try {

        // send the short city code (e.g. 'hcm', 'hn') or empty string for "Toàn quốc"
        const data =
          await fetchAllListings({
            keyword,
            type: typeParam,
            city: city || "",
            limit: 100,
            maxPages: 5,
          });

        console.log(
          "✅ Loaded:",
          data?.length
        );

        if (
          data &&
          data.length > 0
        ) {

          applyFilter();

          // Lưu lịch sử tìm kiếm nếu có keyword hoặc city
          if (keyword || city) {
            saveSearchToHistory(keyword, city);
          }

        } else {

          listingEl.innerHTML = `
          <div class="col-span-3 text-center py-20">
            <span class="material-symbols-outlined text-6xl text-gray-400">
              search_off
            </span>

            <p class="mt-4 text-lg font-semibold">
              Không tìm thấy dữ liệu
            </p>
          </div>
        `;
        }

      } catch (err) {

        console.error(err);

        listingEl.innerHTML = `
        <div class="col-span-3 text-center py-20 text-red-500">

          <span class="material-symbols-outlined text-6xl">
            error
          </span>

          <p class="mt-4 font-bold">
            Lỗi tải dữ liệu
          </p>

          <p class="mt-2 text-sm">
            ${err.message}
          </p>

        </div>
      `;
      }

      // =====================================
      // SEARCH INPUT
      // =====================================
      searchInput.value = keyword;

      const toggleClearButton =
        () => {

          if (
            searchInput.value.trim()
          ) {

            clearSearchBtn.classList.remove(
              "opacity-0",
              "pointer-events-none"
            );

          } else {

            clearSearchBtn.classList.add(
              "opacity-0",
              "pointer-events-none"
            );
          }
        };

      toggleClearButton();

      let searchTimeout;

      searchInput.addEventListener(
        "input",
        () => {

          toggleClearButton();

          clearTimeout(
            searchTimeout
          );

          searchTimeout =
            setTimeout(() => {

              window.__SEARCH_STATE__.keyword =
                searchInput.value.trim();

              window.currentPage = 1;

              applyFilter(true);

            }, 300);
        }
      );

      clearSearchBtn.addEventListener(
        "click",
        () => {

          searchInput.value = "";

          window.__SEARCH_STATE__.keyword =
            "";

          toggleClearButton();

          applyFilter();
        }
      );

      // =====================================
      // SORTING
      // =====================================
      document
        .getElementById(
          "sortSelect"
        )
        ?.addEventListener(
          "change",
          (e) => {

            const val =
              e.target.value;

            if (
              !window.filteredData
            ) return;

            switch (val) {

              case "price_asc":
                window.filteredData.sort(
                  (a, b) =>
                    (a.price || 0) -
                    (b.price || 0)
                );
                break;

              case "price_desc":
                window.filteredData.sort(
                  (a, b) =>
                    (b.price || 0) -
                    (a.price || 0)
                );
                break;

              case "area_asc":
                window.filteredData.sort(
                  (a, b) =>
                    (a.area_m2 || 0) -
                    (b.area_m2 || 0)
                );
                break;

              case "area_desc":
                window.filteredData.sort(
                  (a, b) =>
                    (b.area_m2 || 0) -
                    (a.area_m2 || 0)
                );
                break;

              default:
                window.filteredData.sort(
                  (a, b) =>
                    (b.score || 0) -
                    (a.score || 0)
                );
            }

            window.currentPage = 1;

            if (
              window.renderPage
            ) {
              window.renderPage();
            }

            if (
              !mapContainer.classList.contains(
                "hidden"
              )
            ) {
              window.renderMapMarkers();
            }
          }
        );

      // =====================================
      // MAP
      // =====================================
      let map = null;
      let markers = [];

      // INIT MAP
      window.initMap = function () {

        map = new maplibregl.Map({

          container:
            "mapContainer",

          style:
            "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",

          center: [
            106.7009,
            10.7769,
          ],

          zoom: 12,
        });

        map.addControl(
          new maplibregl.NavigationControl()
        );

        map.on(
          "load",
          () => {
            window.renderMapMarkers();
          }
        );
      };

      // RENDER MARKERS
      window.renderMapMarkers =
        function () {

          if (
            !map ||
            !window.filteredData
          ) {
            return;
          }

          // remove old markers
          markers.forEach((m) =>
            m.remove()
          );

          markers = [];

          const bounds =
            new maplibregl.LngLatBounds();

          let hasValidCoords =
            false;

          window.filteredData
            .slice(0, 50)
            .forEach((item) => {

              let lat = Number(
                item.latitude ||
                item.lat
              );

              let lng = Number(
                item.longitude ||
                item.lng
              );

              // fallback fake location
              if (
                isNaN(lat) ||
                isNaN(lng)
              ) {

                lat =
                  10.7769 +
                  (Math.random() - 0.5) *
                  0.1;

                lng =
                  106.7009 +
                  (Math.random() - 0.5) *
                  0.1;

              } else {

                hasValidCoords =
                  true;
              }

              // marker
              const el =
                document.createElement(
                  "div"
                );

              el.className =
                "w-8 h-8 bg-primary text-white rounded-full flex items-center justify-center border-2 border-white shadow-lg cursor-pointer hover:scale-110 transition-transform";

              el.innerHTML = `
              <span class="material-symbols-outlined text-[18px]">
                location_on
              </span>
            `;

              const image =
                item.image ||
                "https://placehold.co/400x300?text=No+Image";

              // popup
              const popupContent = `
              <div class="w-[250px]">

                <img
                  src="${image}"
                  class="w-full h-32 object-cover rounded-lg mb-2"
                  onerror="this.src='https://placehold.co/400x300?text=No+Image'"
                />

                <h3 class="font-bold text-sm mb-1 line-clamp-2">
                  ${item.title || "Không có tiêu đề"}
                </h3>

                <p class="text-primary font-bold mb-1">
                  ${item.price
                  ? (
                    item.price /
                    1000000
                  ).toFixed(1) +
                  " triệu"
                  : "Thoả thuận"
                }
                </p>

                <p class="text-xs text-gray-500 mb-2 line-clamp-2">
                  ${item.address || ""}
                </p>

                <a
                  href="./chitiet.html?id=${item.id}"
                  class="inline-block px-3 py-1 bg-primary text-white rounded text-sm"
                >
                  Xem chi tiết
                </a>

              </div>
            `;

              const popup =
                new maplibregl.Popup({
                  offset: 25,
                }).setHTML(
                  popupContent
                );

              const marker =
                new maplibregl.Marker({
                  element: el,
                })
                  .setLngLat([
                    lng,
                    lat,
                  ])
                  .setPopup(
                    popup
                  )
                  .addTo(map);

              markers.push(
                marker
              );

              bounds.extend([
                lng,
                lat,
              ]);
            });

          // fit bounds
          if (
            hasValidCoords &&
            markers.length > 0
          ) {

            map.fitBounds(
              bounds,
              {
                padding: 50,
                maxZoom: 14,
              }
            );
          }
        };

      // =====================================
      // TOGGLE MAP
      // =====================================
      toggleMapBtn?.addEventListener(
        "click",
        () => {

          mapContainer.classList.toggle(
            "hidden"
          );

          // init first time
          if (!map) {

            window.initMap();

          } else {

            setTimeout(() => {
              map.resize();
            }, 200);

            window.renderMapMarkers();
          }
        }
      );

      // =====================================
      // RENDER PAGE OVERRIDE
      // =====================================
      const oldRenderPage =
        window.renderPage;

      window.renderPage =
        function () {

          if (
            oldRenderPage
          ) {
            oldRenderPage();
          }

          if (
            window.renderMapMarkers &&
            !mapContainer.classList.contains(
              "hidden"
            )
          ) {
            window.renderMapMarkers();
          }
        };

    })();
  </script>

      const userUI = document.getElementById("user-actions");

      const logoutBtn = document.getElementById("btn-logout");

      const user = JSON.parse(raw);

      // switch UI
      guestUI?.classList.add("hidden");
      userUI?.classList.remove("hidden");

      if (userNameEl) {
        userNameEl.textContent = user.fullName || user.email || "User";
